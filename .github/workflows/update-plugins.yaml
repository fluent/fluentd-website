name: Update plugins

on:
  schedule:
    - cron: '8 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: 4.0
      - name: Update plugins.json
        run: ruby scripts/plugins.rb
      - name: Commit files
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
          else
            git config --global user.name "${{ github.actor }}"
            git config --global user.email "${{ github.actor }}"@users.noreply.github.com
          fi
          git add scripts/plugins.json
          git commit -F scripts/message.txt && git push origin master || echo "No need to update"
