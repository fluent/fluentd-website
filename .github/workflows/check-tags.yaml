name: Check tag files

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  tags:
    runs-on: ubuntu-latest

    name: Check tag files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Check tag files are properly updated
        run: |
          bundle exec rake update_tags
          git --no-pager diff --exit-code
